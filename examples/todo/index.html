<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, "Helvetica Neue", sans-serif; background: #f6f7f9; color: #1d2330; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; background: #fff; border-bottom: 1px solid #e4e7ec; }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 12px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  form { display: flex; gap: 10px; margin-bottom: 18px; }
  input { flex: 1; font: inherit; padding: 10px 14px; border: 1px solid #cfd4dc; border-radius: 8px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; cursor: pointer; transition: background .15s, transform .1s; }
  button:hover { background: #4f46e5; }
  button:active { transform: scale(.97); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid #f0f2f5; animation: in .25s ease-out; }
  li.done span { text-decoration: line-through; color: #98a2b3; }
  li input { flex: none; width: 18px; height: 18px; accent-color: #6366f1; }
  @keyframes in { from { opacity: 0; transform: translateY(-6px); } }
  .stats { margin-top: 16px; color: #667085; font-size: 13px; }
</style>
</head>
<body>
<header><h1>Tasks</h1><button id="share">Share</button></header>
<main>
  <div class="card">
    <form id="form">
      <input id="new" placeholder="What needs to be done?" autocomplete="off">
      <button id="add">Add task</button>
    </form>
    <ul id="list"></ul>
    <div class="stats" id="stats"></div>
  </div>
</main>
<script>
  const list = document.getElementById("list");
  const stats = document.getElementById("stats");
  const render = () => {
    const all = list.children.length, done = list.querySelectorAll(".done").length;
    stats.textContent = `${done} of ${all} done`;
  };
  const add = (text) => {
    const li = document.createElement("li");
    li.innerHTML = `<input type="checkbox"><span></span>`;
    li.querySelector("span").textContent = text;
    li.querySelector("input").addEventListener("change", (e) => { li.classList.toggle("done", e.target.checked); render(); });
    list.append(li);
    render();
  };
  ["Review pull requests", "Update the changelog"].forEach(add);
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("new");
    if (input.value.trim()) add(input.value.trim());
    input.value = "";
  });
</script>
</body>
</html>
