<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · Tasks</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 -apple-system, "Helvetica Neue", sans-serif; background: #f6f7f9; color: #1d2330; }
  .card { width: 400px; background: #fff; border: 1px solid #e4e7ec; border-radius: 12px; padding: 32px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0 0 24px; color: #667085; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  input { width: 100%; font: inherit; padding: 10px 14px; margin-bottom: 16px; border: 1px solid #cfd4dc; border-radius: 8px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
  button { width: 100%; font: inherit; font-weight: 600; padding: 11px 18px; margin-top: 8px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; cursor: pointer; transition: background .15s, transform .1s; }
  button:hover { background: #4f46e5; }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
<form class="card" id="form">
  <h1>Welcome back</h1>
  <p>Sign in to see your tasks.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="off">
  <label for="password">Password</label>
  <input id="password" type="password">
  <button id="login">Log in</button>
</form>
<script>
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    setTimeout(() => (location.href = "index.html"), 300);
  });
</script>
</body>
</html>
