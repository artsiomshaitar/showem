<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>member-invite.mp4</title>
<style>
  :root {
    --bar: #1f1f21;
    --fg: #f2f2f3;
    --dim: #a3a3a8;
    --line: rgba(255,255,255,.1);
    --font: -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid; place-items: center;
    overflow: hidden;
    background: #000 url(/wallpaper) center / cover;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* An almost full-screen player window. The stage is taller than 16:9, so the video gets black bars above and below. */
  .window {
    display: flex; flex-direction: column;
    width: min(1180px, 100vw - 120px);
    height: min(770px, 100vh - 40px);
    border-radius: 12px;
    background: #000;
    box-shadow: 0 0 0 1px var(--line), 0 30px 90px -12px rgba(0,0,0,.75);
    overflow: hidden;
  }
  .titlebar {
    flex: none;
    display: flex; align-items: center; gap: 14px;
    height: 44px; padding: 0 16px;
    background: var(--bar);
    border-bottom: 1px solid rgba(0,0,0,.6);
    color: var(--fg); font-size: 14px; font-weight: 600;
  }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }

  .stage { position: relative; flex: 1; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  .controls {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px;
    width: min(760px, 100% - 48px); height: 46px; padding: 0 18px;
    border-radius: 14px;
    background: rgba(40,40,44,.72);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 10px 30px -8px rgba(0,0,0,.6);
    color: var(--fg);
    transition: opacity .4s ease;
  }
  .controls.hidden { opacity: 0; }
  .controls svg { display: block; flex: none; }
  .controls .icon { color: var(--fg); opacity: .9; }
  .time { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 36px; }
  .track { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); }
  .track .done { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--fg); }
  .track .knob { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-play" viewBox="0 0 20 20" fill="currentColor"><path d="M6 3.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2A.8.8 0 0 0 6 3.8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="3.5" width="3.6" height="13" rx="1"/><rect x="11.4" y="3.5" width="3.6" height="13" rx="1"/></symbol>
  <symbol id="i-back" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5A7.5 7.5 0 1 1 3.5 12"/><path d="M5 3.5v4h4"/><text x="11" y="14.6" font-size="6.5" font-family="-apple-system, system-ui" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text></symbol>
  <symbol id="i-fwd" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7.5A7.5 7.5 0 1 0 18.5 12"/><path d="M17 3.5v4h-4"/><text x="11" y="14.6" font-size="6.5" font-family="-apple-system, system-ui" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text></symbol>
</svg>

<div class="window">
  <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div>member-invite.mp4</div>
  <div class="stage">
    <video id="video" src="/video" muted playsinline preload="auto"></video>
    <div class="controls" id="controls">
      <svg class="icon" width="22" height="22"><use href="#i-back"/></svg>
      <svg class="icon" width="20" height="20"><use id="toggle" href="#i-play"/></svg>
      <svg class="icon" width="22" height="22"><use href="#i-fwd"/></svg>
      <span class="time" id="now">00:00</span>
      <div class="track"><div class="done" id="done"></div><div class="knob" id="knob"></div></div>
      <span class="time" id="total">00:00</span>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById("video");
  const $ = (id) => document.getElementById(id);
  const clock = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  function draw() {
    const share = video.duration ? video.currentTime / video.duration : 0;
    $("done").style.width = `${share * 100}%`;
    $("knob").style.left = `${share * 100}%`;
    $("now").textContent = clock(video.currentTime);
    if (!video.paused) requestAnimationFrame(draw);
  }

  video.addEventListener("loadedmetadata", () => { $("total").textContent = clock(video.duration); draw(); });
  // Like a real player: the controls fade out a couple of seconds after playing starts and come back when it ends.
  let hideTimer;
  video.addEventListener("play", () => {
    $("toggle").setAttribute("href", "#i-pause");
    draw();
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => $("controls").classList.add("hidden"), 2000);
  });
  video.addEventListener("ended", () => {
    clearTimeout(hideTimer);
    $("controls").classList.remove("hidden");
  });
  video.addEventListener("pause", () => { $("toggle").setAttribute("href", "#i-play"); draw(); });

  document.addEventListener("keydown", (e) => {
    if (e.key !== " ") return;
    e.preventDefault();
    video.paused ? video.play() : video.pause();
  });
</script>
</body>
</html>
