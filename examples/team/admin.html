<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team · Northwind</title>
<style>
  :root {
    --ink: #17191c; --muted: #6b7076; --line: #e7e5e0; --bg: #f6f5f2; --card: #fff;
    --accent: #0f766e; --accent-soft: #e6f2f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); display: flex; height: 100vh; }
  aside { width: 232px; padding: 22px 14px; border-right: 1px solid var(--line); background: #fbfaf8; display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; padding: 0 10px 18px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
  nav a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
  nav a.on { background: #efede8; color: var(--ink); }
  main { flex: 1; padding: 36px 44px; overflow: auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin-top: 2px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .ghost { background: #efede8; color: var(--ink); }
  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  .card h2 { margin: 0 0 14px; font-size: 15px; }
  .invite { display: none; margin-bottom: 24px; align-items: center; gap: 14px; background: var(--accent-soft); border-color: #cfe5e1; animation: drop .35s ease-out; }
  .invite.show { display: flex; }
  .invite .label { font-weight: 600; }
  .invite a { flex: 1; font: 14px ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); background: #fff; border: 1px solid #cfe5e1; border-radius: 8px; padding: 9px 12px; text-decoration: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  .member { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .member:first-child { border-top: 0; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 13px; color: #fff; }
  .member .name { font-weight: 600; }
  .member .meta { color: var(--muted); font-size: 13px; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: #efede8; color: var(--muted); }
  .member.new { animation: flash 2.4s ease-out; border-radius: 10px; }
  .member.new .badge { background: var(--accent-soft); color: var(--accent); }
  textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; resize: none; height: 78px; outline: none; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer { display: flex; justify-content: flex-end; margin: 10px 0 6px; }
  .post { padding: 13px 0; border-top: 1px solid var(--line); }
  .post .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .post.new { animation: drop .35s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
  @keyframes flash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">N</div>Northwind</div>
  <nav>
    <a href="#">Home</a>
    <a href="#" class="on">Team</a>
    <a href="#">Projects</a>
    <a href="#">Settings</a>
  </nav>
</aside>
<main>
  <header>
    <div>
      <h1>Team</h1>
      <div class="sub" id="count"></div>
    </div>
    <button class="primary" id="invite">Invite member</button>
  </header>
  <div class="card invite" id="invite-card">
    <span class="label">Invite link</span>
    <a id="invite-link" href="#"></a>
    <button class="ghost">Copy</button>
  </div>
  <div class="grid">
    <section class="card">
      <h2>Members</h2>
      <ul id="members"></ul>
    </section>
    <section class="card">
      <h2>Announcements</h2>
      <textarea id="announcement" placeholder="Share an update with the team"></textarea>
      <div class="composer"><button class="primary" id="post">Post</button></div>
      <ul id="posts"></ul>
    </section>
  </div>
</main>
<script>
  const COLORS = ["#0f766e", "#b45309", "#7c3aed", "#be123c", "#1d4ed8"];
  const initials = (name) => name.split(" ").map((w) => w[0]).join("").slice(0, 2);
  const ago = (at) => {
    const s = (Date.now() - at) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.round(s / 60)} min ago`;
    if (s < 86400) return `${Math.round(s / 3600)} h ago`;
    return `${Math.round(s / 86400)} days ago`;
  };
  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  let seen = null;

  function render({ members, posts }) {
    document.getElementById("count").textContent = `${members.length} members`;
    const list = document.getElementById("members");
    list.replaceChildren(...members.map((m, i) => {
      const fresh = seen && !seen.members.has(m.id);
      return el(`<li class="member${fresh ? " new" : ""}">
        <div class="avatar" style="background:${COLORS[i % COLORS.length]}">${initials(m.name)}</div>
        <div><div class="name">${esc(m.name)}</div><div class="meta">Joined ${ago(m.joinedAt)}</div></div>
        <span class="badge">${fresh ? "New" : m.role}</span>
      </li>`);
    }));
    document.getElementById("posts").replaceChildren(...posts.map((p) => el(`<li class="post${seen && !seen.posts.has(p.id) ? " new" : ""}">
      <div>${esc(p.text)}</div><div class="meta">${esc(p.author)} · ${ago(p.at)}</div></li>`)));
    seen = { members: new Set(members.map((m) => m.id)), posts: new Set(posts.map((p) => p.id)) };
  }

  new EventSource("/api/events").onmessage = (e) => render(JSON.parse(e.data));

  document.getElementById("invite").onclick = async () => {
    const { url } = await (await fetch("/api/invites", { method: "POST" })).json();
    const link = document.getElementById("invite-link");
    link.href = url;
    link.textContent = url.replace(/^https?:\/\//, "");
    document.getElementById("invite-card").classList.add("show");
  };

  document.getElementById("post").onclick = async () => {
    const box = document.getElementById("announcement");
    if (!box.value.trim()) return;
    await fetch("/api/posts", { method: "POST", body: JSON.stringify({ text: box.value }) });
    box.value = "";
  };
</script>
</body>
</html>
