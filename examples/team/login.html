<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in · Northwind</title>
<style>
  :root { --ink: #17191c; --muted: #6b7076; --line: #e7e5e0; --bg: #f6f5f2; --accent: #0f766e; --accent-soft: #e6f2f0; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); min-height: 100vh; display: grid; place-items: center; }
  form { width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 32px; }
  .logo { width: 44px; height: 44px; border-radius: 11px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 19px; margin-bottom: 18px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  p { margin: 0 0 22px; color: var(--muted); }
  label { font-size: 13px; font-weight: 600; color: var(--muted); }
  input { width: 100%; margin: 6px 0 14px; font: inherit; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button { width: 100%; margin-top: 6px; font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  .error { display: none; color: #be123c; margin: 12px 0 0; }
</style>
</head>
<body>
<form id="form">
  <div class="logo">N</div>
  <h1>Log in to Northwind</h1>
  <p>Admin console</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="off">
  <label for="password">Password</label>
  <input id="password" type="password">
  <button id="login">Log in</button>
  <p class="error" id="error">Wrong email or password</p>
</form>
<script>
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value });
    const res = await fetch("/api/login", { method: "POST", body });
    if (res.ok) location.href = "/admin";
    else document.getElementById("error").style.display = "block";
  });
</script>
</body>
</html>
