<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; display: grid; grid-template-columns: 280px 1fr; height: 100vh; font: 15px/1.5 -apple-system, "Helvetica Neue", sans-serif; background: #fff; color: #1d2330; }
  aside { border-right: 1px solid #e4e7ec; background: #f8f9fb; display: flex; flex-direction: column; }
  aside header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; }
  aside h1 { font-size: 16px; margin: 0; }
  #new { font: inherit; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 8px; background: #4338ca; color: #fff; cursor: pointer; }
  #new:hover { background: #3730a3; }
  ul { list-style: none; margin: 0; padding: 0 8px; overflow: auto; }
  li { padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  li.added { animation: in .2s ease-out; }
  li + li { margin-top: 2px; }
  li.active { background: #e0e7ff; }
  li strong { display: block; font-size: 14px; }
  li span { color: #667085; font-size: 13px; }
  main { padding: 40px 56px; display: flex; flex-direction: column; gap: 12px; }
  #title { font: inherit; font-size: 28px; font-weight: 600; line-height: 1.3; border: 0; outline: none; padding: 0; }
  #body { flex: 1; font: inherit; border: 0; outline: none; resize: none; padding: 0; color: #344054; }
  #saved { color: #98a2b3; font-size: 13px; }
  /* For testing captions: pinned to the bottom edge, centered, about as wide as a caption. */
  #tag-form { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); width: 320px; height: 34px; display: flex; gap: 8px; }
  #tag { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 0 10px; border: 1px solid #cfd4dc; border-radius: 8px; outline: none; }
  #tag:focus { border-color: #4338ca; box-shadow: 0 0 0 3px rgba(67,56,202,.2); }
  #add-tag { font: inherit; font-size: 14px; font-weight: 600; padding: 0 14px; border: 0; border-radius: 8px; background: #4338ca; color: #fff; cursor: pointer; }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
</style>
</head>
<body>
<aside>
  <header><h1>Notes</h1><button id="new">New note</button></header>
  <ul id="list"></ul>
</aside>
<main>
  <input id="title" placeholder="Title" autocomplete="off">
  <textarea id="body" placeholder="Start writing…"></textarea>
  <div id="saved"></div>
  <form id="tag-form">
    <input id="tag" placeholder="Add a tag" autocomplete="off">
    <button id="add-tag">Add tag</button>
  </form>
</main>
<script>
  const notes = [
    { title: "Weekly sync", body: "Ship the onboarding flow before Friday." },
    { title: "Ideas", body: "Dark mode, shared notebooks, offline sync." },
  ];
  let current = 0;
  const list = document.getElementById("list");
  const title = document.getElementById("title");
  const body = document.getElementById("body");
  const saved = document.getElementById("saved");

  function draw() {
    list.innerHTML = "";
    notes.forEach((note, i) => {
      const li = document.createElement("li");
      li.className = i === current ? "active" : "";
      li.innerHTML = `<strong></strong><span></span>`;
      li.querySelector("strong").textContent = note.title || "Untitled";
      li.querySelector("span").textContent = note.body.slice(0, 32) || "Empty";
      li.onclick = () => open(i);
      list.append(li);
    });
  }
  function open(i) {
    current = i;
    title.value = notes[i].title;
    body.value = notes[i].body;
    saved.textContent = "";
    draw();
  }
  function edit() {
    notes[current] = { title: title.value, body: body.value };
    saved.textContent = "Saved";
    draw();
  }
  document.getElementById("tag-form").onsubmit = (e) => {
    e.preventDefault();
    const tag = document.getElementById("tag");
    if (tag.value) saved.textContent = `Tagged “${tag.value}”`;
    tag.value = "";
  };
  title.oninput = edit;
  body.oninput = edit;
  document.getElementById("new").onclick = () => {
    notes.unshift({ title: "", body: "" });
    open(0);
    list.firstChild.classList.add("added");
    title.focus();
  };
  open(0);
</script>
</body>
</html>
