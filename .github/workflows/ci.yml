name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.showem
          key: showem-tools-${{ runner.arch }}-${{ hashFiles('src/deps.ts') }}
      # The tests check videos with ffprobe.
      - run: brew install ffmpeg
      - run: bun run typecheck
      - run: bun test
