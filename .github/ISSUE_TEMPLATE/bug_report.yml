name: Bug report
description: Something went wrong while recording or rendering
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you expected, what you got, and the error if there was one.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Script
      description: The script you ran, or the smallest one that shows the problem. Remove anything private.
      render: yaml
  - type: input
    attributes:
      label: showem version
      description: Output of `showem --version`
    validations:
      required: true
  - type: input
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.1, Apple M3
